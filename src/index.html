<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Salah Streak</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  padding-left:var(--safe-area-inset-left,env(safe-area-inset-left,0px));
  padding-right:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --bg:#f3faf5; --card:#ffffff; --ink:#17302a; --muted:#62796f; --line:#dce9e0;
  --green:#58cc02; --green-d:#46a302; --gold:#ffc800; --gold-d:#d9a400;
  --red:#ff4b4b; --red-d:#d63a3a; --blue:#1cb0f6; --soft:#e7f7d8; --dot:#d6e2da;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10201a; --card:#18302a; --ink:#e8f5ee; --muted:#93b0a2; --line:#2a463d;
    --soft:#22401f; --dot:#2d4a40;
  }
}
:root[data-theme="dark"]{
  --bg:#10201a; --card:#18302a; --ink:#e8f5ee; --muted:#93b0a2; --line:#2a463d;
  --soft:#22401f; --dot:#2d4a40;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;
  font-weight:700;-webkit-font-smoothing:antialiased}
body{min-height:100%}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-weight:900;font-size:20px;letter-spacing:-.01em;min-width:0}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0;overflow-wrap:anywhere}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:900;font-size:15px;white-space:nowrap}
.chip.flame{color:#ff9600}.chip.xp{color:var(--gold-d)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:900}
.lvl{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvl b{white-space:nowrap;font-weight:900}
.lvl .bar{flex:1;height:12px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .6s ease}
.bar.gold>i{background:var(--gold)}
.hero.urgent .bar>i{background:var(--red)}
.mascot{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.moon{font-size:46px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.moon{animation:none}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.bubble{position:relative;background:var(--soft);border-radius:16px;padding:10px 14px;font-size:15px;flex:1}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--soft)}
.hero .label{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}
.hero .pname{font-size:32px;font-weight:900;line-height:1.1;margin:2px 0 0}
.hero .pname small{font-size:18px;color:var(--muted);font-weight:700;margin-left:6px}
.cd{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0 8px}
.hero.urgent .cd{color:var(--red)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.next{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line);font-size:14px;color:var(--muted)}
.next b{color:var(--ink)}
.btn{font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.05em;font-size:14px;border:0;border-radius:14px;
  padding:12px 18px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);cursor:pointer;width:100%;margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:12px}
.btn.gold{background:var(--gold);color:#4a3600;box-shadow:0 4px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.done-pill{display:inline-block;background:var(--soft);color:var(--green-d);border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:900}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:2px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{font-size:26px;width:36px;text-align:center}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:900;font-size:17px}
.row .nm small{color:var(--muted);margin-left:4px}
.row .tm{font-size:13px;color:var(--muted)}
.row.cur{background:var(--soft);margin:0 -10px;padding:11px 10px;border-radius:14px;border-bottom:0}
.row.opt .nm b{color:#5b6cff}
.tag{font-weight:900;font-size:13px;white-space:nowrap}
.tag.ok{color:var(--green-d)}.tag.late{color:var(--gold-d)}.tag.lock{color:var(--muted)}
.week{display:flex;justify-content:space-between;gap:4px}
.day{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.day.today b{color:var(--ink)}
.dots{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--dot);display:block}
.dots i.ok{background:var(--green)}.dots i.late{background:var(--gold)}
.dots i.tah{background:#5b6cff;width:10px;height:10px;margin-top:3px}
.dots i.tahoff{width:10px;height:10px;margin-top:3px;opacity:.5}
.dots.perfect{filter:drop-shadow(0 0 4px var(--green))}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{text-align:center;font-size:11px;line-height:1.2;color:var(--muted)}
.badge .em{font-size:30px;display:block;margin-bottom:2px}
.badge.locked .em{filter:grayscale(1);opacity:.35}
.badge.got{color:var(--ink)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.set span{font-size:15px}
.set select{font:inherit;font-weight:800;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:62%}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px;font-weight:700}
.locrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.locin{flex:1;min-width:0;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.res{display:block;width:100%;text-align:left;font:inherit;font-weight:700;padding:10px 12px;margin-top:6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.res:active{background:var(--soft)}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 4px}
.chipb{font:inherit;font-weight:900;font-size:13px;padding:8px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chipb.on{background:var(--soft);border-color:var(--green);color:var(--green-d)}
.upd{border-color:var(--green)}
#toasts{position:fixed;left:0;right:0;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:#17302a;color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .35s ease}
.toast.gold{background:var(--gold);color:#4a3600}
.toast.green{background:var(--green-d)}
@keyframes pop{from{transform:translateY(-14px) scale(.9);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:55}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>

<script src="native.js"></script>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
var PR=[
  {id:"fajr",name:"Fajr",bn:"ফজর",icon:"🌅"},
  {id:"dhuhr",name:"Dhuhr",bn:"যোহর",icon:"☀️"},
  {id:"asr",name:"Asr",bn:"আসর",icon:"🌤️"},
  {id:"maghrib",name:"Maghrib",bn:"মাগরিব",icon:"🌇"},
  {id:"isha",name:"Isha",bn:"এশা",icon:"🌙"}
];
var TAH={id:"tahajjud",name:"Tahajjud",bn:"তাহাজ্জুদ",icon:"🌌"};
var KEY="salah_streak_v1";
var APP_VERSION=parseInt("__APP_VERSION__",10)||0;
var STORE_BUILD="__STORE_BUILD__"==="1";
var REPO="imrajitt-cmd/salah-streak";
var DEFAULT_LOC={name:"Dhaka, Bangladesh",lat:23.8103,lng:90.4125,tz:"Asia/Dhaka"};
var WARN_OPTS=[30,20,15,10,5];
var METHODS={
  karachi:{name:"Karachi (Univ. of Islamic Sciences)",fajr:18,isha:18},
  mwl:{name:"Muslim World League",fajr:18,isha:17},
  isna:{name:"ISNA (North America)",fajr:15,isha:15},
  egypt:{name:"Egyptian General Authority",fajr:19.5,isha:17.5},
  makkah:{name:"Umm al-Qura (Makkah)",fajr:18.5,ishaMin:90},
  turkey:{name:"Diyanet (Turkey)",fajr:18,isha:17}
};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------- storage (always guarded) ---------- */
var mem={};
function sget(k){try{return window.localStorage.getItem(k);}catch(e){return mem[k]==null?null:mem[k];}}
function sset(k,v){try{window.localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
var S={log:{},settings:{notif:false,sound:true,warns:[30,15,5],tahNotif:false},notified:{},badges:[],
  update:null,lastCheck:0,dismissed:0,loc:null,locSet:false,method:"karachi",asr:"hanafi",manual:false};
try{
  var raw=sget(KEY);
  if(raw){
    var p0=JSON.parse(raw);
    if(p0&&typeof p0==="object"){
      S.log=p0.log||{};
      var st0=p0.settings||{};
      S.settings.notif=!!st0.notif;
      S.settings.sound=st0.sound!==false;
      S.settings.tahNotif=!!st0.tahNotif;
      if(Array.isArray(st0.warns)){S.settings.warns=st0.warns;}
      else if(typeof st0.warn==="number"){S.settings.warns=[st0.warn,5];}
      S.notified=p0.notified||{};
      S.badges=p0.badges||[];
      S.update=p0.update||null;S.lastCheck=p0.lastCheck||0;S.dismissed=p0.dismissed||0;
      S.loc=p0.loc||null;S.locSet=!!p0.locSet;
      S.method=METHODS[p0.method]?p0.method:"karachi";
      S.asr=p0.asr==="standard"?"standard":"hanafi";
      S.manual=!!p0.manual;
    }
  }
}catch(e){}
(function(){
  var w=S.settings.warns.filter(function(v){return WARN_OPTS.indexOf(v)>=0;});
  w=w.filter(function(v,i){return w.indexOf(v)===i;}).sort(function(a,b){return b-a;});
  S.settings.warns=w;
  var l=S.loc;
  if(!l||typeof l.lat!=="number"||typeof l.lng!=="number"||typeof l.tz!=="string"||!l.name){S.loc={name:DEFAULT_LOC.name,lat:DEFAULT_LOC.lat,lng:DEFAULT_LOC.lng,tz:DEFAULT_LOC.tz};}
})();
function save(){
  var keys=Object.keys(S.notified);
  if(keys.length>200){keys.sort();keys.slice(0,keys.length-200).forEach(function(k){delete S.notified[k];});}
  sset(KEY,JSON.stringify(S));
}

/* ---------- prayer time maths ---------- */
var rad=Math.PI/180;
function sin(a){return Math.sin(a*rad);}
function cos(a){return Math.cos(a*rad);}
function fixA(a){return a-360*Math.floor(a/360);}
function fixH(a){return a-24*Math.floor(a/24);}
function julian(y,m,d){
  if(m<=2){y-=1;m+=12;}
  var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPos(jd){
  var D=jd-2451545.0;
  var g=fixA(357.529+0.98560028*D);
  var q=fixA(280.459+0.98564736*D);
  var L=fixA(q+1.915*sin(g)+0.020*sin(2*g));
  var e=23.439-0.00000036*D;
  var RA=fixH(Math.atan2(cos(e)*sin(L),cos(L))/rad/15);
  return {decl:Math.asin(sin(e)*sin(L))/rad, eqt:q/15-RA};
}
var fmtCache={};
function tzOff(tz,ms){
  try{
    var f=fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}));
    var o={};
    f.formatToParts(new Date(ms)).forEach(function(x){o[x.type]=x.value;});
    var h=+o.hour;if(h===24)h=0;
    var asUTC=Date.UTC(+o.year,+o.month-1,+o.day,h,+o.minute,+o.second);
    return Math.round((asUTC-Math.floor(ms/1000)*1000)/60000);
  }catch(e){return -new Date(ms).getTimezoneOffset();}
}
var tcache={};
function times(y,m,d){
  var LAT=S.loc.lat, LNG=S.loc.lng;
  var ck=[y,m,d,LAT,LNG,S.loc.tz,S.method,S.asr].join("|");
  if(tcache[ck])return tcache[ck];
  var M=METHODS[S.method]||METHODS.karachi;
  var jd=julian(y,m,d)-LNG/(15*24);
  function mid(t){return fixH(12-sunPos(jd+t).eqt);}
  function ang(a,t,ccw){
    var dec=sunPos(jd+t).decl;
    var x=(-sin(a)-sin(dec)*sin(LAT))/(cos(dec)*cos(LAT));
    if(x<-1||x>1)return NaN;
    var v=Math.acos(x)/rad/15, n=mid(t);
    return ccw?n-v:n+v;
  }
  function asr(f,t){
    var dec=sunPos(jd+t).decl;
    var a=-Math.atan(1/(f+Math.tan(Math.abs(LAT-dec)*rad)))/rad;
    return ang(a,t,false);
  }
  var h={
    fajr:ang(M.fajr,5/24,true),
    sunrise:ang(0.833,6/24,true),
    dhuhr:mid(0.5),
    asr:asr(S.asr==="hanafi"?2:1,13/24),
    sunset:ang(0.833,18/24,false),
    isha:M.ishaMin?0:ang(M.isha,18/24,false)
  };
  // polar day / night fallbacks
  if(isNaN(h.sunrise))h.sunrise=h.dhuhr-6;
  if(isNaN(h.sunset))h.sunset=h.dhuhr+6;
  var night=fixH(h.sunrise-h.sunset);
  if(night<1)night=12;
  function portion(a){return a/60*night;}
  // high latitudes: angle-based rule (never leave Fajr or Isha undefined)
  if(isNaN(h.fajr)||fixH(h.sunrise-h.fajr)>portion(M.fajr))h.fajr=h.sunrise-portion(M.fajr);
  if(M.ishaMin){h.isha=h.sunset+M.ishaMin/60;}
  else if(isNaN(h.isha)||fixH(h.isha-h.sunset)>portion(M.isha)){h.isha=h.sunset+portion(M.isha);}
  if(isNaN(h.asr))h.asr=(h.dhuhr+h.sunset)/2;
  var out={};
  Object.keys(h).forEach(function(k){
    out[k]=Math.round((Date.UTC(y,m-1,d)+(h[k]-LNG/15)*3600000)/60000)*60000;
  });
  // keep the instants on the civil date of the chosen time zone
  var off=tzOff(S.loc.tz,out.dhuhr);
  var localDay=Math.floor((out.dhuhr+off*60000)/86400000);
  var want=Math.round(Date.UTC(y,m-1,d)/86400000);
  var delta=want-localDay;
  if(delta){Object.keys(out).forEach(function(k){out[k]+=delta*86400000;});}
  tcache[ck]=out;
  return out;
}
function suggestMethod(lat,lng){
  if(lat>=22&&lat<=32&&lng>=24&&lng<=34.9)return {m:"egypt",asr:"standard"};
  if(lat>=12&&lat<=33&&lng>=34&&lng<=60)return {m:"makkah",asr:"standard"};
  if(lat>=5&&lat<=37&&lng>=60&&lng<=93)return {m:"karachi",asr:"hanafi"};
  if(lat>=36&&lat<=42&&lng>=26&&lng<=45)return {m:"turkey",asr:"standard"};
  if(lat>=14&&lat<=72&&lng>=-170&&lng<=-50)return {m:"isna",asr:"standard"};
  return {m:"mwl",asr:"standard"};
}

/* ---------- date helpers (in the chosen city's time zone) ---------- */
function dk(ms){
  var off=tzOff(S.loc.tz,ms), d=new Date(ms+off*60000);
  return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes(),s:d.getUTCSeconds(),wd:d.getUTCDay()};
}
function pad(n){return (n<10?"0":"")+n;}
function key(y,m,d){return y+"-"+pad(m)+"-"+pad(d);}
function shift(y,m,d,n){var t=new Date(Date.UTC(y,m-1,d+n));return [t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate()];}
function fmtT(ms){var p=dk(ms),h=p.h%12||12;return h+":"+pad(p.mi)+" "+(p.h<12?"AM":"PM");}
function fmtCD(ms){
  ms=Math.max(0,ms);var s=Math.floor(ms/1000);
  return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
}
function pinfo(id){return id==="tahajjud"?TAH:PR.filter(function(x){return x.id===id;})[0];}

function dayWindows(y,m,d){
  var b=shift(y,m,d,1), t=times(y,m,d), tn=times(b[0],b[1],b[2]), k=key(y,m,d);
  return [
    {day:k,id:"fajr",s:t.fajr,e:t.sunrise},
    {day:k,id:"dhuhr",s:t.dhuhr,e:t.asr},
    {day:k,id:"asr",s:t.asr,e:t.sunset},
    {day:k,id:"maghrib",s:t.sunset,e:t.isha},
    {day:k,id:"isha",s:t.isha,e:tn.fajr}
  ];
}
function windowsFor(now){
  var p=dk(now),out=[];
  for(var n=-1;n<=1;n++){
    var a=shift(p.y,p.m,p.d,n);
    out=out.concat(dayWindows(a[0],a[1],a[2]));
  }
  return out;
}
// Tahajjud: last third of the night (Maghrib to the next Fajr), up to Fajr
function tahWindow(y,m,d){
  var b=shift(y,m,d,1), t=times(y,m,d), tn=times(b[0],b[1],b[2]);
  var night=tn.fajr-t.sunset;
  return {day:key(y,m,d),id:"tahajjud",s:Math.round((tn.fajr-night/3)/60000)*60000,e:tn.fajr};
}
function tahWindows(now){
  var p=dk(now),out=[];
  for(var n=-1;n<=1;n++){var a=shift(p.y,p.m,p.d,n);out.push(tahWindow(a[0],a[1],a[2]));}
  return out;
}
function isDone(w){return !!(S.log[w.day]&&S.log[w.day][w.id]);}
function dayCount(k){var l=S.log[k]||{};return PR.filter(function(x){return l[x.id];}).length;}

/* ---------- stats, XP, badges ---------- */
function runs(keys,pred){
  var res=[],run=0,prev=null;
  keys.forEach(function(k){
    if(!pred(k)){if(run)res.push(run);run=0;prev=null;return;}
    var t=Date.parse(k+"T00:00:00Z");
    if(prev!==null&&t-prev===86400000)run++;else{if(run)res.push(run);run=1;}
    prev=t;
  });
  if(run)res.push(run);
  return res;
}
function maxOf(a){return a.length?Math.max.apply(null,a):0;}
function stats(){
  var xp=0,prayers=0,onTime=0,fajrOn=0,perfect=0,tah=0;
  var keys=Object.keys(S.log).sort();
  keys.forEach(function(k){
    var l=S.log[k],c=0;
    PR.forEach(function(x){
      var r=l[x.id];if(!r)return;
      c++;prayers++;
      if(r.ok){xp+=10;onTime++;if(x.id==="fajr")fajrOn++;}else{xp+=3;}
    });
    if(c===5){perfect++;xp+=20;}
    if(l.tahajjud){tah++;xp+=25;}
  });
  var p=dk(Date.now()),streak=0;
  var off=dayCount(key(p.y,p.m,p.d))===5?0:-1;
  for(;;off--){
    var a=shift(p.y,p.m,p.d,off);
    if(dayCount(key(a[0],a[1],a[2]))===5)streak++;else break;
    if(streak>3650)break;
  }
  var pr=runs(keys,function(k){return dayCount(k)===5;});
  var best=Math.max(maxOf(pr),streak);
  var comeback=pr.some(function(r,i){return i>0&&r>=3&&maxOf(pr.slice(0,i))>=3;});
  var fajrBest=maxOf(runs(keys,function(k){var f=S.log[k].fajr;return !!(f&&f.ok);}));
  var tahBest=maxOf(runs(keys,function(k){return !!S.log[k].tahajjud;}));
  return {xp:xp,prayers:prayers,onTime:onTime,fajrOn:fajrOn,perfect:perfect,tah:tah,tahBest:tahBest,fajrBest:fajrBest,comeback:comeback,streak:streak,best:best,level:Math.floor(xp/100)+1};
}

function confetti(){

  var c=document.createElement("div");c.className="confetti";
  var cols=["#58cc02","#ffc800","#1cb0f6","#ff86d0","#ff4b4b"];
  for(var i=0;i<40;i++){

var actx=null;
function chime(up){
  if(!S.settings.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var notes=up?[523,659,784]:[660,880];
    notes.forEach(function(f,i){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=f;
      var t0=actx.currentTime+i*0.14;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
      o.connect(g);g.connect(actx.destination);
      o.start(t0);o.stop(t0+0.4);
    });
  }catch(e){}
}

// Reminder wording: it gets firmer as the end of the prayer gets closer.
var PH={
  early:[
    ["⏳ {p} is running out","{m} min left for {p} (ends {t}). Pray now and keep your streak 🔥"],
    ["⏳ {p} ending soon","Salah time is slipping away, {m} min left. Do it now before it ends!"],
    ["🕌 Don't miss {p}","Only {m} minutes remain. Take a moment for {p} before it ends."]
  ],
  mid:[
    ["⚠️ {p} almost over","Salah time is almost over! Do it now before it ends. {m} min left."],
    ["⚠️ Only {m} min for {p}","Put everything down and pray {p} now. Your streak depends on it 🔥"],
    ["⚠️ {p} time is closing","{m} minutes left. Make wudu and pray now!"]
  ],
  late:[
    ["🚨 Last chance for {p}!","Only {m} min left! Salah time is almost over, pray right now!"],
    ["🚨 {p} ends in {m} min","This is your final reminder. Pray now before the time ends!"],
    ["🚨 Hurry, {p} is ending","{m} minutes. Don't let it pass. Pray now!"]
  ]
};
function phrase(p,m,t,seed){
  var tier=m>=20?"early":(m>=10?"mid":"late"), a=PH[tier], v=a[Math.abs(seed)%a.length];
  function f(s){return s.replace(/\{p\}/g,p).replace(/\{m\}/g,m).replace(/\{t\}/g,t);}
  return {title:f(v[0]),body:f(v[1])};
}
function buildSchedule(now){
  var items=[],p=dk(now),warns=S.settings.warns;
  for(var n=0;n<30;n++){
    var a=shift(p.y,p.m,p.d,n), k=key(a[0],a[1],a[2]);
    var dn=Math.floor(Date.UTC(a[0],a[1]-1,a[2])/86400000);
    dayWindows(a[0],a[1],a[2]).forEach(function(w,i){
      var nm=pinfo(w.id).name, done=!!(S.log[k]&&S.log[k][w.id]);
      items.push({id:dn*100+i*10,at:w.s,urgent:false,title:nm+" time 🕌",body:"The "+nm+" window just opened ("+fmtT(w.s)+"). Pray on time to keep your streak 🔥"});
      if(done)return;
      warns.forEach(function(m){
        var at=w.e-m*60000, ph=phrase(nm,m,fmtT(w.e),dn+i+m);
        items.push({id:dn*100+i*10+1+WARN_OPTS.indexOf(m),at:at,urgent:true,title:ph.title,body:ph.body});
      });
    });
    if(S.settings.tahNotif){
      var tw=tahWindow(a[0],a[1],a[2]);
      if(!(S.log[k]&&S.log[k].tahajjud)){
        items.push({id:dn*100+9,at:tw.s,urgent:false,title:"🌌 Last third of the night",body:"Tahajjud time has begun (until "+fmtT(tw.e)+"). It's worth +25 XP."});
      }
    }
  }
  return items.filter(function(i){return i.at>now+2000;}).sort(function(x,y){return x.at-y.at;}).slice(0,400);
}
function scheduleNative(){
  if(!NAT)return;
  if(schedBusy){schedAgain=true;return;}
  schedBusy=true;
  window.SalahNative.scheduleAll(buildSchedule(Date.now())).then(function(){},function(){}).then(function(){
    schedBusy=false;
    if(schedAgain){schedAgain=false;scheduleNative();}
  });
}

  fetch("https://api.github.com/repos/"+REPO+"/releases/latest",{headers:{"Accept":"application/vnd.github+json"}})

function notify(title,body){

    if(S.settings.notif&&"Notification" in window&&Notification.permission==="granted"){
      new Notification(title,{body:body,tag:title});

function checkReminders(now,ws){
  if(NAT)return;
  var changed=false;
  ws.forEach(function(w){
    var nm=pinfo(w.id).name, k1=w.day+w.id+"s";
    if(now>=w.s&&now<w.s+5*60000&&!S.notified[k1]){
      S.notified[k1]=1;changed=true;
      notify(nm+" time 🕌","The "+nm+" window just opened ("+fmtT(w.s)+").");
    }
    S.settings.warns.forEach(function(m){
      var wt=w.e-m*60000, k2=w.day+w.id+"w"+m;
      if(!isDone(w)&&now>=wt&&now<wt+5*60000&&now<w.e&&!S.notified[k2]){
        S.notified[k2]=1;changed=true;
        var ph=phrase(nm,m,fmtT(w.e),m);
        notify(ph.title,ph.body);
      }
    });
  });
  if(changed)save();
}

/* ---------- logging a prayer ---------- */
function logPrayer(day,id){
  var now=Date.now(), w;
  if(id==="tahajjud"){
    w=tahWindows(now).filter(function(x){return x.day===day;})[0];
    if(!w||now<w.s||now>=w.e||isDone(w))return;
  }else{
    w=windowsFor(now).filter(function(x){return x.day===day&&x.id===id;})[0];
    if(!w||now<w.s||isDone(w))return;
  }
  var before=stats(), bBefore=earned(before);
  var ok=id==="tahajjud"?true:now<w.e;
  S.log[day]=S.log[day]||{};
  S.log[day][id]={t:now,ok:ok};
  var after=stats(), bAfter=earned(after);
  S.badges=bAfter;
  save();
  scheduleNative();
  var nm=pinfo(id).name;
  if(id==="tahajjud"){toast("+25 XP · Tahajjud logged 🌌","green");chime(true);confetti();}
  else{
    toast((ok?"+10 XP · ":"+3 XP · ")+nm+(ok?" done on time! 🎉":" (qada) logged"),ok?"green":"");
    chime(ok);
    if(ok||dayCount(day)===5)confetti();
    if(dayCount(day)===5){setTimeout(function(){toast("⭐ Perfect day! +20 bonus XP","gold");},700);}
  }
  if(after.level>before.level){setTimeout(function(){toast("🎊 Level up! You're now level "+after.level,"gold");confetti();},1300);}
  bAfter.forEach(function(b){
    if(bBefore.indexOf(b)<0){
      var bd=BADGES.filter(function(x){return x.id===b;})[0];
      setTimeout(function(){toast(bd.em+" New badge: "+bd.name,"gold");},1900);
    }
  });
  render();
}

  h+='<section class="card" id="loccard"><h2>Location &amp; times</h2>';
  h+='<div class="set"><span>📍 '+esc(S.loc.name)+'</span>'+btn("gps","Use GPS","sm")+'</div>';
  h+='<div class="locrow"><input id="locq" class="locin" type="text" placeholder="Search a city, e.g. London" value="'+esc(locQuery)+'" autocomplete="off">'+btn("locsearch","Search","sm")+'</div>';
  if(locMsg)h+='<div class="note">'+esc(locMsg)+'</div>';
  locResults.forEach(function(r,i){h+='<button class="res" data-act="locpick" data-i="'+i+'">'+esc(r.name)+'</button>';});
  h+='<div class="set"><span>Method</span><select data-act="method">';
  Object.keys(METHODS).forEach(function(k){h+='<option value="'+k+'"'+(S.method===k?" selected":"")+'>'+esc(METHODS[k].name)+'</option>';});
  h+='</select></div>';
  h+='<div class="set"><span>Asr</span><select data-act="asr"><option value="standard"'+(S.asr==="standard"?" selected":"")+'>Standard (Shafi, Maliki, Hanbali)</option><option value="hanafi"'+(S.asr==="hanafi"?" selected":"")+'>Hanafi</option></select></div>';
  h+='<div class="note">City search sends the name you type to the free Open-Meteo service. Your GPS position stays on your phone and only approximate location is used. Method and Asr are chosen for your region; change them to match your local mosque. Very far north or south, some times are estimates.</div></section>';

  // reminders
  var chips='';
  WARN_OPTS.forEach(function(m){chips+='<button class="chipb'+(S.settings.warns.indexOf(m)>=0?" on":"")+'" data-act="warnchip" data-v="'+m+'">'+m+' min</button>';});
  if(NAT){
    var on=nperm==="granted";
    h+='<section class="card"><h2>Reminders</h2>';
    h+='<div class="set"><span>Background reminders</span>'+btn("notif",on?"On":"Turn on",on?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>Exact timing</span>'+btn("exact",nexact?"On":"Allow",nexact?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>Sound effects in the app</span>'+btn("sound",S.settings.sound?"On":"Off",S.settings.sound?"sm":"sm ghost")+'</div>';
    h+='<div class="set" style="display:block"><span>"Almost over" alerts: how long before a prayer ends</span><div class="chipsrow">'+chips+'</div></div>';
    h+='<div class="set"><span>Tahajjud reminder (last third of the night)</span>'+btn("tahnotif",S.settings.tahNotif?"On":"Off",S.settings.tahNotif?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>Try a normal reminder</span>'+btn("test","Test","sm ghost")+'</div>';
    h+='<div class="set"><span>Try an "almost over" alert</span>'+btn("testu","Test","sm ghost")+'</div>';
    h+='<div class="note">Reminders are scheduled on your phone for the next few weeks and arrive even when the app is closed. Open the app now and then so it can schedule more. Silent or Do Not Disturb mode can still mute them. If reminders go missing, set this app\'s battery usage to <b>Unrestricted</b> / allow auto-start in your phone settings (needed on Xiaomi, Oppo, Vivo, Realme and some Samsung phones).</div></section>';
  }else{
    var perm="Notification" in window?Notification.permission:"unsupported";
    h+='<section class="card"><h2>Reminders</h2>';
    h+='<div class="set"><span>Phone notifications</span>'+btn("notif",S.settings.notif&&perm==="granted"?"On":"Turn on",S.settings.notif&&perm==="granted"?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>Sound</span>'+btn("sound",S.settings.sound?"On":"Off",S.settings.sound?"sm":"sm ghost")+'</div>';
    h+='<div class="set" style="display:block"><span>"Almost over" alerts</span><div class="chipsrow">'+chips+'</div></div>';
    h+='<div class="set"><span>Try a reminder</span>'+btn("test","Test","sm ghost")+'</div>';
    h+='<div class="note">Reminders fire while this page is open.</div></section>';
  }

  var M=METHODS[S.method]||METHODS.karachi;
  h+='<footer>Times for '+esc(S.loc.name)+' ('+esc(M.name)+', '+(S.asr==="hanafi"?"Hanafi":"Standard")+' Asr) can differ by a few minutes from your local mosque timetable. Your progress is saved on this phone only. · Version '+APP_VERSION+'</footer>';

  document.getElementById("app").innerHTML=h;
  updateLive(now,ws);
}

function updateLive(now,ws){
  var c=current(now,ws), cw=c.cw, nw=c.nw, cd=document.getElementById("cd");
  var hero=document.getElementById("hero");
  var title="Salah Streak";
  if(cw){
    var left=cw.e-now, total=cw.e-cw.s;
    if(cd)cd.textContent=fmtCD(left);
    var bar=document.getElementById("bar");
    if(bar)bar.style.width=Math.min(100,Math.max(0,(now-cw.s)/total*100))+"%";
    var urgent=!isDone(cw)&&urgentMs()>0&&left<urgentMs();
    if(hero){if(urgent)hero.classList.add("urgent");else hero.classList.remove("urgent");}
    var bub=document.getElementById("bubble");
    if(bub&&urgent)bub.textContent="Hurry! Only "+Math.ceil(left/60000)+" min left for "+pinfo(cw.id).name+"! ⏳";
    var nx=document.getElementById("nx");
    if(nx&&nw)nx.textContent=fmtCD(nw.s-now);
    title=pinfo(cw.id).name+" · "+fmtCD(left)+" left";
  }else if(nw){
    if(cd)cd.textContent=fmtCD(nw.s-now);
    title=pinfo(nw.id).name+" in "+fmtCD(nw.s-now);
  }
  document.title=title;
}

function tick(){
  var now=Date.now(), ws=windowsFor(now);
  checkReminders(now,ws);
  var k=stateKey(now), p=dk(now);
  var ae=document.activeElement, typing=!!(ae&&ae.id==="locq");
  if((k!==curKey||p.s===0)&&!typing){render();}else{updateLive(now,ws);}
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!el||el.tagName==="SELECT")return;
  var act=el.getAttribute("data-act");
  if(act==="pray"){logPrayer(el.getAttribute("data-day"),el.getAttribute("data-id"));}
  else if(act==="upd-get"){var u=updateInfo();if(u&&NAT){window.SalahNative.openUrl(u.url);}}
  else if(act==="upd-later"){var u2=updateInfo();if(u2){S.dismissed=u2.n;save();render();}}
  else if(act==="gps"){useGps();}
  else if(act==="gotoloc"){var lc=document.getElementById("loccard");if(lc&&lc.scrollIntoView)lc.scrollIntoView({behavior:"smooth"});}
  else if(act==="keeploc"){S.locSet=true;save();render();}
  else if(act==="locsearch"){var q=document.getElementById("locq");if(q)locQuery=q.value;doSearch();}
  else if(act==="locpick"){var r=locResults[parseInt(el.getAttribute("data-i"),10)];if(r)setLocation(r);}
  else if(act==="warnchip"){
    var v=parseInt(el.getAttribute("data-v"),10), w=S.settings.warns, ix=w.indexOf(v);
    if(ix>=0)w.splice(ix,1);else w.push(v);
    w.sort(function(a,b){return b-a;});
    save();scheduleNative();render();
  }
  else if(act==="tahnotif"){S.settings.tahNotif=!S.settings.tahNotif;save();scheduleNative();render();}
  else if(act==="sound"){S.settings.sound=!S.settings.sound;save();if(S.settings.sound)chime(false);render();}
  else if(act==="test"){
    if(NAT){
      if(nperm!=="granted"){toast("Turn on background reminders first.");return;}
      window.SalahNative.testNow(false).then(function(ok){toast(ok?"Test reminder coming in 3 seconds. You can close the app to try it 🔔":"Couldn't schedule the test.");});
    }else{notify("Test reminder 🕌","This is how your Salah reminders will look.");}
  }
  else if(act==="testu"){
    if(NAT){
      if(nperm!=="granted"){toast("Turn on background reminders first.");return;}
      window.SalahNative.testNow(true).then(function(ok){toast(ok?"Alert coming in 3 seconds. Close the app and listen 🚨":"Couldn't schedule the test.");});
    }
  }
  else if(act==="exact"){if(NAT){window.SalahNative.openExactSettings();}}
  else if(act==="notif"){
    if(NAT){
      window.SalahNative.requestPermission().then(function(r){
        nperm=r;
        if(r==="granted"){toast("Background reminders on ✅","green");scheduleNative();}
        else{toast("Notifications are blocked. Enable them in phone Settings > Apps > Salah Streak.");}
        refreshNative(render);
      });
      return;
    }
    if(!("Notification" in window)){toast("This browser doesn't support notifications. In-app reminders still work.");return;}
    if(S.settings.notif&&Notification.permission==="granted"){S.settings.notif=false;save();render();return;}
    try{
      var pr=Notification.requestPermission(function(res){afterPerm(res);});
      if(pr&&pr.then)pr.then(afterPerm);
    }catch(e){toast("Notifications are blocked here. In-app reminders still work.");}
  }
});
function afterPerm(res){
  if(res==="granted"){S.settings.notif=true;save();toast("Notifications on ✅","green");}
  else{S.settings.notif=false;save();toast("Notifications not allowed. In-app reminders still work.");}
  render();
}
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el||!el.getAttribute)return;
  var act=el.getAttribute("data-act");
  if(act==="method"&&METHODS[el.value]){S.method=el.value;S.manual=true;save();scheduleNative();render();}
  else if(act==="asr"){S.asr=el.value==="standard"?"standard":"hanafi";S.manual=true;save();scheduleNative();render();}
});
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="locq")locQuery=ev.target.value;});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="locq"){locQuery=ev.target.value;doSearch();}
});

render();
refreshNative(function(){render();scheduleNative();});
checkUpdate(false);
setInterval(tick,1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();refreshNative(function(){render();scheduleNative();});}});
if(NAT){window.SalahNative.onResume(function(){refreshNative(function(){render();scheduleNative();});checkUpdate(false);});}
})();
</script>
