<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Salah Streak</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px));
  padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
  padding-left:var(--safe-area-inset-left,env(safe-area-inset-left,0px));
  padding-right:var(--safe-area-inset-right,env(safe-area-inset-right,0px));
  --bg:#f3faf5; --card:#ffffff; --ink:#17302a; --muted:#62796f; --line:#dce9e0;
  --green:#58cc02; --green-d:#46a302; --gold:#ffc800; --gold-d:#d9a400;
  --red:#ff4b4b; --red-d:#d63a3a; --blue:#1cb0f6; --soft:#e7f7d8; --dot:#d6e2da;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10201a; --card:#18302a; --ink:#e8f5ee; --muted:#93b0a2; --line:#2a463d;
    --soft:#22401f; --dot:#2d4a40;
  }
}
:root[data-theme="dark"]{
  --bg:#10201a; --card:#18302a; --ink:#e8f5ee; --muted:#93b0a2; --line:#2a463d;
  --soft:#22401f; --dot:#2d4a40;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Naskh Arabic",sans-serif;
  font-weight:700;-webkit-font-smoothing:antialiased}
html[lang="bn"],html[lang="ar"],html[lang="ur"]{line-height:1.6}
html[lang="ar"] *,html[lang="ur"] *{letter-spacing:0 !important}
body{min-height:100%}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{font-weight:900;font-size:20px;letter-spacing:-.01em;min-width:0}
.brand small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:0;overflow-wrap:anywhere}
.chips{display:flex;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-weight:900;font-size:15px;white-space:nowrap}
.chip.flame{color:#ff9600}.chip.xp{color:var(--gold-d)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:900}
.lvl{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lvl b{white-space:nowrap;font-weight:900}
.lvl .bar{flex:1;height:12px}
.bar{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .6s ease}
.bar.gold>i{background:var(--gold)}
.hero.urgent .bar>i{background:var(--red)}
.mascot{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.moon{font-size:46px;line-height:1;animation:bob 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.moon{animation:none}}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
.bubble{position:relative;background:var(--soft);border-radius:16px;padding:10px 14px;font-size:15px;flex:1}
.bubble::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-8px;border:8px solid transparent;border-left:0;border-right-color:var(--soft)}
[dir="rtl"] .bubble::before{left:auto;right:-8px;border-right:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:8px solid var(--soft)}
.hero .label{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:900}
.hero .pname{font-size:32px;font-weight:900;line-height:1.15;margin:2px 0 0}
.hero .pname small{font-size:18px;color:var(--muted);font-weight:700;margin-inline-start:6px}
.cd{font-size:44px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:6px 0 8px;direction:ltr;text-align:start}
[dir="rtl"] .cd{text-align:right}
.hero.urgent .cd{color:var(--red)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);margin-top:6px}
.next{margin-top:12px;padding-top:12px;border-top:2px dashed var(--line);font-size:14px;color:var(--muted)}
.next b{color:var(--ink)}
.btn{font:inherit;font-weight:900;text-transform:uppercase;letter-spacing:.05em;font-size:14px;border:0;border-radius:14px;
  padding:12px 18px;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);cursor:pointer;width:100%;margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn.sm{width:auto;margin:0;padding:8px 12px;font-size:12px}
.btn.gold{background:var(--gold);color:#4a3600;box-shadow:0 4px 0 var(--gold-d)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-d)}
.btn.ghost{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.done-pill{display:inline-block;background:var(--soft);color:var(--green-d);border-radius:12px;padding:10px 14px;margin-top:12px;font-weight:900}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:2px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{font-size:26px;width:36px;text-align:center}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:900;font-size:17px}
.row .nm small{color:var(--muted);margin-inline-start:4px}
.row .tm{font-size:13px;color:var(--muted)}
.row.cur{background:var(--soft);margin:0 -10px;padding:11px 10px;border-radius:14px;border-bottom:0}
.row.opt .nm b{color:#5b6cff}
.tag{font-weight:900;font-size:13px;white-space:nowrap}
.tag.ok{color:var(--green-d)}.tag.late{color:var(--gold-d)}.tag.lock{color:var(--muted)}
.week{display:flex;justify-content:space-between;gap:4px}
.day{flex:1;text-align:center;font-size:12px;color:var(--muted)}
.day.today b{color:var(--ink)}
.dots{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--dot);display:block}
.dots i.ok{background:var(--green)}.dots i.late{background:var(--gold)}
.dots i.tah{background:#5b6cff;width:10px;height:10px;margin-top:3px}
.dots i.tahoff{width:10px;height:10px;margin-top:3px;opacity:.5}
.dots.perfect{filter:drop-shadow(0 0 4px var(--green))}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge{text-align:center;font-size:11px;line-height:1.25;color:var(--muted)}
.badge .em{font-size:30px;display:block;margin-bottom:2px}
.badge.locked .em{filter:grayscale(1);opacity:.35}
.badge.got{color:var(--ink)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.set span{font-size:15px}
.set select{font:inherit;font-weight:800;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);max-width:62%}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px;font-weight:700}
.locrow{display:flex;gap:8px;align-items:center;margin:8px 0}
.locin{flex:1;min-width:0;font:inherit;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.res{display:block;width:100%;text-align:start;font:inherit;font-weight:700;padding:10px 12px;margin-top:6px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.res:active{background:var(--soft)}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px;padding:6px 0 4px}
.chipb{font:inherit;font-weight:900;font-size:13px;padding:8px 12px;border-radius:99px;border:2px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer}
.chipb.on{background:var(--soft);border-color:var(--green);color:var(--green-d)}
.upd{border-color:var(--green)}
.pick .res{text-align:center;font-size:19px;padding:14px 12px}
#toasts{position:fixed;left:0;right:0;top:calc(var(--safe-area-inset-top,env(safe-area-inset-top,0px)) + 10px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:60;pointer-events:none}
.toast{background:#17302a;color:#fff;border-radius:14px;padding:10px 16px;font-weight:800;font-size:14px;max-width:92%;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:pop .35s ease}
.toast.gold{background:var(--gold);color:#4a3600}
.toast.green{background:var(--green-d)}
@keyframes pop{from{transform:translateY(-14px) scale(.9);opacity:0}}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:55}
.confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;margin-top:6px}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="app"></div>

<script src="native.js"></script>
<script src="i18n.js"></script>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
var PR=[{id:"fajr",icon:"🌅"},{id:"dhuhr",icon:"☀️"},{id:"asr",icon:"🌤️"},{id:"maghrib",icon:"🌇"},{id:"isha",icon:"🌙"}];
var ICONS={fajr:"🌅",dhuhr:"☀️",asr:"🌤️",maghrib:"🌇",isha:"🌙",jumuah:"🕌",tahajjud:"🌌"};
var KEY="salah_streak_v1";
var APP_VERSION=parseInt("__APP_VERSION__",10)||0;
var STORE_BUILD="__STORE_BUILD__"==="1";
var REPO="imrajitt-cmd/salah-streak";
var DEFAULT_LOC={name:"Dhaka, Bangladesh",lat:23.8103,lng:90.4125,tz:"Asia/Dhaka",cc:"BD"};
var WARN_OPTS=[30,20,15,10,5];
var XP_ON=10,XP_JUM=15,XP_LATE=3,XP_TAH=25;
var LANGS=window.I18N_LANGS||[{code:"en",name:"English",dir:"ltr"}];
var TR=window.I18N||{en:{}};
var DIG=window.I18N_DIGITS||{};
var ARN=window.I18N_ARABIC_NAMES||{};
var SEC_LANGS={en:1,id:1,ms:1,tr:1,fr:1};
// Fajr/Isha angles per method. The method is chosen automatically from the location.
var METHODS={
  karachi:{fajr:18,isha:18},
  mwl:{fajr:18,isha:17},
  isna:{fajr:15,isha:15},
  egypt:{fajr:19.5,isha:17.5},
  makkah:{fajr:18.5,ishaMin:90},
  turkey:{fajr:18,isha:17},
  sea:{fajr:20,isha:18}
};
var CC_METHOD={
  BD:["karachi","hanafi"],IN:["karachi","hanafi"],PK:["karachi","hanafi"],AF:["karachi","hanafi"],NP:["karachi","hanafi"],
  LK:["karachi","standard"],MV:["karachi","standard"],MY:["karachi","standard"],
  TR:["turkey","standard"],
  SA:["makkah","standard"],YE:["makkah","standard"],OM:["makkah","standard"],AE:["makkah","standard"],KW:["makkah","standard"],QA:["makkah","standard"],BH:["makkah","standard"],
  EG:["egypt","standard"],SD:["egypt","standard"],LY:["egypt","standard"],SY:["egypt","standard"],LB:["egypt","standard"],IQ:["egypt","standard"],JO:["egypt","standard"],PS:["egypt","standard"],
  ID:["sea","standard"],SG:["sea","standard"],BN:["sea","standard"],
  US:["isna","standard"],CA:["isna","standard"],
  UZ:["mwl","hanafi"],TJ:["mwl","hanafi"],KG:["mwl","hanafi"],TM:["mwl","hanafi"],KZ:["mwl","hanafi"]
};
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ---------- storage (always guarded) ---------- */
var mem={};
function sget(k){try{return window.localStorage.getItem(k);}catch(e){return mem[k]==null?null:mem[k];}}
function sset(k,v){try{window.localStorage.setItem(k,v);}catch(e){mem[k]=v;}}
var S={log:{},settings:{notif:false,sound:true,warns:[30,15,5],tahNotif:false},notified:{},badges:[],
  update:null,lastCheck:0,dismissed:0,loc:null,locSet:false,method:"karachi",asr:"hanafi",
  lang:null,digits:"latn",h24:null,friday:"jumuah",mosque:""};
try{
  var raw=sget(KEY);
  if(raw){
    var p0=JSON.parse(raw);
    if(p0&&typeof p0==="object"){
      S.log=p0.log||{};
      var st0=p0.settings||{};
      S.settings.notif=!!st0.notif;
      S.settings.sound=st0.sound!==false;
      S.settings.tahNotif=!!st0.tahNotif;
      if(Array.isArray(st0.warns)){S.settings.warns=st0.warns;}
      else if(typeof st0.warn==="number"){S.settings.warns=[st0.warn,5];}
      S.notified=p0.notified||{};
      S.badges=p0.badges||[];
      S.update=p0.update||null;S.lastCheck=p0.lastCheck||0;S.dismissed=p0.dismissed||0;
      S.loc=p0.loc||null;S.locSet=!!p0.locSet;
      S.lang=(p0.lang&&TR[p0.lang])?p0.lang:null;
      S.digits=p0.digits==="local"?"local":"latn";
      S.h24=typeof p0.h24==="boolean"?p0.h24:null;
      S.friday=p0.friday==="dhuhr"?"dhuhr":"jumuah";
      S.mosque=/^\d\d:\d\d$/.test(p0.mosque||"")?p0.mosque:"";
    }
  }
}catch(e){}
(function(){
  var w=S.settings.warns.filter(function(v){return WARN_OPTS.indexOf(v)>=0;});
  w=w.filter(function(v,i){return w.indexOf(v)===i;}).sort(function(a,b){return b-a;});
  S.settings.warns=w;
  var l=S.loc;
  if(!l||typeof l.lat!=="number"||typeof l.lng!=="number"||typeof l.tz!=="string"||!l.name){
    S.loc={name:DEFAULT_LOC.name,lat:DEFAULT_LOC.lat,lng:DEFAULT_LOC.lng,tz:DEFAULT_LOC.tz,cc:DEFAULT_LOC.cc};
  }
})();
function save(){
  var keys=Object.keys(S.notified);
  if(keys.length>200){keys.sort();keys.slice(0,keys.length-200).forEach(function(k){delete S.notified[k];});}
  sset(KEY,JSON.stringify(S));
}

/* ---------- language ---------- */
function guessLang(){
  var l="en";
  try{l=(navigator.language||"en").slice(0,2).toLowerCase();}catch(e){}
  return TR[l]?l:"en";
}
function curLang(){return S.lang||guessLang();}
function t(k,v){
  var L=TR[curLang()]||TR.en, s=(L&&L[k]!=null)?L[k]:TR.en[k];
  if(s==null)return k;
  if(typeof s!=="string")return s;
  return v?s.replace(/\{(\w+)\}/g,function(m,n){return v[n]!=null?v[n]:m;}):s;
}
function langMeta(){var c=curLang();for(var i=0;i<LANGS.length;i++){if(LANGS[i].code===c)return LANGS[i];}return LANGS[0];}
function D(s){
  s=String(s);
  var map=DIG[curLang()];
  if(S.digits!=="local"||!map)return s;
  return s.replace(/[0-9]/g,function(d){return map.charAt(+d);});
}
function N(x){return D(String(x));}
function applyLang(){
  var m=langMeta();
  document.documentElement.lang=m.code;
  document.documentElement.dir=m.dir;
}
function pad(n){return (n<10?"0":"")+n;}
function pinfo(id,jum){
  var k=jum?"jumuah":id;
  return {id:id,name:t("p_"+k),sec:SEC_LANGS[curLang()]?(ARN[k]||""):"",icon:ICONS[k]};
}

/* ---------- prayer time maths ---------- */
var rad=Math.PI/180;
function sin(a){return Math.sin(a*rad);}
function cos(a){return Math.cos(a*rad);}
function fixA(a){return a-360*Math.floor(a/360);}
function fixH(a){return a-24*Math.floor(a/24);}
function julian(y,m,d){
  if(m<=2){y-=1;m+=12;}
  var A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPos(jd){
  var D0=jd-2451545.0;
  var g=fixA(357.529+0.98560028*D0);
  var q=fixA(280.459+0.98564736*D0);
  var L=fixA(q+1.915*sin(g)+0.020*sin(2*g));
  var e=23.439-0.00000036*D0;
  var RA=fixH(Math.atan2(cos(e)*sin(L),cos(L))/rad/15);
  return {decl:Math.asin(sin(e)*sin(L))/rad, eqt:q/15-RA};
}
var fmtCache={};
function tzOff(tz,ms){
  try{
    var f=fmtCache[tz]||(fmtCache[tz]=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}));
    var o={};
    f.formatToParts(new Date(ms)).forEach(function(x){o[x.type]=x.value;});
    var h=+o.hour;if(h===24)h=0;
    var asUTC=Date.UTC(+o.year,+o.month-1,+o.day,h,+o.minute,+o.second);
    return Math.round((asUTC-Math.floor(ms/1000)*1000)/60000);
  }catch(e){return -new Date(ms).getTimezoneOffset();}
}
// The calculation method is picked automatically from the location (nobody has to choose).
function autoMethod(lat,lng,cc){
  cc=(cc||"").toUpperCase();
  if(CC_METHOD[cc])return {m:CC_METHOD[cc][0],asr:CC_METHOD[cc][1]};
  if(lat>=22&&lat<=32&&lng>=24&&lng<=34.9)return {m:"egypt",asr:"standard"};
  if(lat>=12&&lat<=33&&lng>=34&&lng<=60)return {m:"makkah",asr:"standard"};
  if(lat>=5&&lat<=37&&lng>=60&&lng<=93)return {m:"karachi",asr:"hanafi"};
  if(lat>=-11&&lat<=8&&lng>=95&&lng<=141)return {m:"sea",asr:"standard"};
  if(lat>=36&&lat<=42&&lng>=26&&lng<=45)return {m:"turkey",asr:"standard"};
  if(lat>=14&&lat<=72&&lng>=-170&&lng<=-50)return {m:"isna",asr:"standard"};
  return {m:"mwl",asr:"standard"};
}
function applyAuto(){var a=autoMethod(S.loc.lat,S.loc.lng,S.loc.cc);S.method=a.m;S.asr=a.asr;}
applyAuto();

var tcache={};
function times(y,m,d){
  var LAT=S.loc.lat, LNG=S.loc.lng;
  var ck=[y,m,d,LAT,LNG,S.loc.tz,S.method,S.asr].join("|");
  if(tcache[ck])return tcache[ck];
  var M=METHODS[S.method]||METHODS.karachi;
  var jd=julian(y,m,d)-LNG/(15*24);
  function mid(tt){return fixH(12-sunPos(jd+tt).eqt);}
  function ang(a,tt,ccw){
    var dec=sunPos(jd+tt).decl;
    var x=(-sin(a)-sin(dec)*sin(LAT))/(cos(dec)*cos(LAT));
    if(x<-1||x>1)return NaN;
    var v=Math.acos(x)/rad/15, n=mid(tt);
    return ccw?n-v:n+v;
  }
  function asr(f,tt){
    var dec=sunPos(jd+tt).decl;
    var a=-Math.atan(1/(f+Math.tan(Math.abs(LAT-dec)*rad)))/rad;
    return ang(a,tt,false);
  }
  var h={
    fajr:ang(M.fajr,5/24,true),
    sunrise:ang(0.833,6/24,true),
    dhuhr:mid(0.5),
    asr:asr(S.asr==="hanafi"?2:1,13/24),
    sunset:ang(0.833,18/24,false),
    isha:M.ishaMin?0:ang(M.isha,18/24,false)
  };
  if(isNaN(h.sunrise))h.sunrise=h.dhuhr-6;
  if(isNaN(h.sunset))h.sunset=h.dhuhr+6;
  var night=fixH(h.sunrise-h.sunset);
  if(night<1)night=12;
  function portion(a){return a/60*night;}
  if(isNaN(h.fajr)||fixH(h.sunrise-h.fajr)>portion(M.fajr))h.fajr=h.sunrise-portion(M.fajr);
  if(M.ishaMin){h.isha=h.sunset+M.ishaMin/60;}
  else if(isNaN(h.isha)||fixH(h.isha-h.sunset)>portion(M.isha)){h.isha=h.sunset+portion(M.isha);}
  if(isNaN(h.asr))h.asr=(h.dhuhr+h.sunset)/2;
  var out={};
  Object.keys(h).forEach(function(k){
    out[k]=Math.round((Date.UTC(y,m-1,d)+(h[k]-LNG/15)*3600000)/60000)*60000;
  });
  var off=tzOff(S.loc.tz,out.dhuhr);
  var localDay=Math.floor((out.dhuhr+off*60000)/86400000);
  var want=Math.round(Date.UTC(y,m-1,d)/86400000);
  var delta=want-localDay;
  if(delta){Object.keys(out).forEach(function(k){out[k]+=delta*86400000;});}
  tcache[ck]=out;
  return out;
}

/* ---------- date helpers (in the chosen city's time zone) ---------- */
function dk(ms){
  var off=tzOff(S.loc.tz,ms), d=new Date(ms+off*60000);
  return {y:d.getUTCFullYear(),m:d.getUTCMonth()+1,d:d.getUTCDate(),h:d.getUTCHours(),mi:d.getUTCMinutes(),s:d.getUTCSeconds(),wd:d.getUTCDay()};
}
function key(y,m,d){return y+"-"+pad(m)+"-"+pad(d);}
function shift(y,m,d,n){var tt=new Date(Date.UTC(y,m-1,d+n));return [tt.getUTCFullYear(),tt.getUTCMonth()+1,tt.getUTCDate()];}
function isFri(y,m,d){return new Date(Date.UTC(y,m-1,d)).getUTCDay()===5;}
function fmtHM(h,mi){
  var s;
  if(S.h24){s=pad(h)+":"+pad(mi);}
  else{var hh=h%12||12;s=hh+":"+pad(mi)+" "+(h<12?t("am"):t("pm"));}
  return D(s);
}
function fmtT(ms){var p=dk(ms);return fmtHM(p.h,p.mi);}
function fmtCD(ms){
  ms=Math.max(0,ms);var s=Math.floor(ms/1000);
  return D(pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60));
}
function localMs(y,m,d,hh,mm){
  var g=Date.UTC(y,m-1,d,hh,mm), off=tzOff(S.loc.tz,g), ms=g-off*60000, off2=tzOff(S.loc.tz,ms);
  if(off2!==off)ms=g-off2*60000;
  return ms;
}

function dayWindows(y,m,d){
  var b=shift(y,m,d,1), tm=times(y,m,d), tn=times(b[0],b[1],b[2]), k=key(y,m,d);
  var jum=S.friday==="jumuah"&&isFri(y,m,d);
  return [
    {day:k,id:"fajr",s:tm.fajr,e:tm.sunrise},
    {day:k,id:"dhuhr",s:tm.dhuhr,e:tm.asr,jum:jum},
    {day:k,id:"asr",s:tm.asr,e:tm.sunset},
    {day:k,id:"maghrib",s:tm.sunset,e:tm.isha},
    {day:k,id:"isha",s:tm.isha,e:tn.fajr}
  ];
}
function windowsFor(now){
  var p=dk(now),out=[];
  for(var n=-1;n<=1;n++){
    var a=shift(p.y,p.m,p.d,n);
    out=out.concat(dayWindows(a[0],a[1],a[2]));
  }
  return out;
}
// Tahajjud: last third of the night (Maghrib to the next Fajr), up to Fajr
function tahWindow(y,m,d){
  var b=shift(y,m,d,1), tm=times(y,m,d), tn=times(b[0],b[1],b[2]);
  var night=tn.fajr-tm.sunset;
  return {day:key(y,m,d),id:"tahajjud",s:Math.round((tn.fajr-night/3)/60000)*60000,e:tn.fajr};
}
function tahWindows(now){
  var p=dk(now),out=[];
  for(var n=-1;n<=1;n++){var a=shift(p.y,p.m,p.d,n);out.push(tahWindow(a[0],a[1],a[2]));}
  return out;
}
function isDone(w){return !!(S.log[w.day]&&S.log[w.day][w.id]);}
function dayCount(k){var l=S.log[k]||{};return PR.filter(function(x){return l[x.id];}).length;}
function winXp(w){return w.jum?XP_JUM:XP_ON;}

/* ---------- stats, XP, badges ---------- */
function runs(keys,pred,step){
  var res=[],run=0,prev=null;
  keys.forEach(function(k){
    if(!pred(k)){if(run)res.push(run);run=0;prev=null;return;}
    var tt=Date.parse(k+"T00:00:00Z");
    if(prev!==null&&tt-prev===step)run++;else{if(run)res.push(run);run=1;}
    prev=tt;
  });
  if(run)res.push(run);
  return res;
}
function maxOf(a){return a.length?Math.max.apply(null,a):0;}
function stats(){
  var xp=0,prayers=0,onTime=0,fajrOn=0,perfect=0,tah=0,DAY=86400000;
  var keys=Object.keys(S.log).sort();
  keys.forEach(function(k){
    var l=S.log[k],c=0;
    PR.forEach(function(x){
      var r=l[x.id];if(!r)return;
      c++;prayers++;
      if(r.ok){xp+=(r.j?XP_JUM:XP_ON);onTime++;if(x.id==="fajr")fajrOn++;}else{xp+=XP_LATE;}
    });
    if(c===5){perfect++;xp+=20;}
    if(l.tahajjud){tah++;xp+=XP_TAH;}
  });
  var p=dk(Date.now()),streak=0;
  var off=dayCount(key(p.y,p.m,p.d))===5?0:-1;
  for(;;off--){
    var a=shift(p.y,p.m,p.d,off);
    if(dayCount(key(a[0],a[1],a[2]))===5)streak++;else break;
    if(streak>3650)break;
  }
  var pr=runs(keys,function(k){return dayCount(k)===5;},DAY);
  var best=Math.max(maxOf(pr),streak);
  var comeback=pr.some(function(r,i){return i>0&&r>=3&&maxOf(pr.slice(0,i))>=3;});
  var fajrBest=maxOf(runs(keys,function(k){var f=S.log[k].fajr;return !!(f&&f.ok);},DAY));
  var tahBest=maxOf(runs(keys,function(k){return !!S.log[k].tahajjud;},DAY));
  var friBest=maxOf(runs(keys,function(k){var r=S.log[k].dhuhr;return !!(r&&r.j&&r.ok);},7*DAY));
  return {xp:xp,prayers:prayers,onTime:onTime,fajrOn:fajrOn,perfect:perfect,tah:tah,tahBest:tahBest,fajrBest:fajrBest,friBest:friBest,comeback:comeback,streak:streak,best:best,level:Math.floor(xp/100)+1};
}
var BADGES=[
  {id:"first",em:"🌱",k:"b_first",n:0,test:function(s){return s.prayers>=1;}},
  {id:"perfect",em:"⭐",k:"b_perfect",n:0,test:function(s){return s.perfect>=1;}},
  {id:"s3",em:"🔥",k:"b_streak",n:3,test:function(s){return s.best>=3;}},
  {id:"s7",em:"🏅",k:"b_streak",n:7,test:function(s){return s.best>=7;}},
  {id:"s14",em:"🚀",k:"b_streak",n:14,test:function(s){return s.best>=14;}},
  {id:"s30",em:"👑",k:"b_streak",n:30,test:function(s){return s.best>=30;}},
  {id:"fajr10",em:"🌄",k:"b_fajr",n:10,test:function(s){return s.fajrOn>=10;}},
  {id:"early",em:"🐦",k:"b_early",n:7,test:function(s){return s.fajrBest>=7;}},
  {id:"ot50",em:"⏱️",k:"b_ontime",n:50,test:function(s){return s.onTime>=50;}},
  {id:"p100",em:"💎",k:"b_prayers",n:100,test:function(s){return s.prayers>=100;}},
  {id:"p500",em:"🏆",k:"b_prayers",n:500,test:function(s){return s.prayers>=500;}},

  {id:"fri12",em:"🕋",k:"b_fri",n:12,test:function(s){return s.friBest>=12;}},
  {id:"owl",em:"🦉",k:"b_owl",n:0,test:function(s){return s.tah>=1;}},
  {id:"tah7",em:"🌌",k:"b_tahrow",n:7,test:function(s){return s.tahBest>=7;}},
  {id:"tah10",em:"🌠",k:"b_tah",n:10,test:function(s){return s.tah>=10;}},
  {id:"tah30",em:"✨",k:"b_tah",n:30,test:function(s){return s.tah>=30;}}
];

function earned(s){return BADGES.filter(function(b){return b.test(s);}).map(function(b){return b.id;});}

/* ---------- feedback: toast, confetti, sound ---------- */
function toast(msg,cls){
  var box=document.getElementById("toasts");
  var el=document.createElement("div");
  el.className="toast "+(cls||"");el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},4200);
}
function confetti(){
  try{if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;}catch(e){}
  var c=document.createElement("div");c.className="confetti";
  var cols=["#58cc02","#ffc800","#1cb0f6","#ff86d0","#ff4b4b"];
  for(var i=0;i<40;i++){
    var s=document.createElement("i");
    s.style.left=(Math.random()*100)+"%";
    s.style.background=cols[i%5];
    s.style.animationDelay=(Math.random()*0.3)+"s";
    s.style.animationDuration=(1.3+Math.random()*1.1)+"s";
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(function(){if(c.parentNode)c.parentNode.removeChild(c);},3000);
}
var actx=null;
function chime(up){
  if(!S.settings.sound)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    var notes=up?[523,659,784]:[660,880];
    notes.forEach(function(f,i){
      var o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=f;
      var t0=actx.currentTime+i*0.14;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
      o.connect(g);g.connect(actx.destination);
      o.start(t0);o.stop(t0+0.4);
    });
  }catch(e){}
}

/* ---------- native (Android) background reminders ---------- */
var NAT=!!(window.SalahNative&&window.SalahNative.isNative);
var nperm="unknown", nexact=true, schedBusy=false, schedAgain=false;
function refreshNative(cb){
  if(!NAT){if(cb)cb();return;}
  window.SalahNative.permission().then(function(p){
    nperm=p;
    return window.SalahNative.exactAllowed();
  }).then(function(x){nexact=x;if(cb)cb();}).catch(function(){if(cb)cb();});
}
// Reminder wording gets firmer as the end of the prayer gets closer.
function phrase(p,m,tstr,seed){
  var tier=m>=20?"ph_early":(m>=10?"ph_mid":"ph_late");
  var a=t(tier); if(!Array.isArray(a))a=TR.en[tier];
  var v=a[Math.abs(seed)%a.length];
  function f(s){return s.replace(/\{p\}/g,p).replace(/\{m\}/g,N(m)).replace(/\{t\}/g,tstr);}
  return {title:f(v[0]),body:f(v[1])};
}
function buildSchedule(now){
  var items=[],p=dk(now),warns=S.settings.warns;
  for(var n=0;n<30;n++){
    var a=shift(p.y,p.m,p.d,n), k=key(a[0],a[1],a[2]);
    var dn=Math.floor(Date.UTC(a[0],a[1]-1,a[2])/86400000);
    dayWindows(a[0],a[1],a[2]).forEach(function(w,i){
      var nm=pinfo(w.id,w.jum).name, done=!!(S.log[k]&&S.log[k][w.id]);
      items.push({id:dn*100+i*10,at:w.s,urgent:false,title:t("n_start_title",{p:nm}),body:t("n_start_body",{p:nm,t:fmtT(w.s)})});
      if(done)return;
      warns.forEach(function(m){
        var at=w.e-m*60000, ph=phrase(nm,m,fmtT(w.e),dn+i+m);
        items.push({id:dn*100+i*10+1+WARN_OPTS.indexOf(m),at:at,urgent:true,title:ph.title,body:ph.body});
      });
    });
    if(S.settings.tahNotif){
      var tw=tahWindow(a[0],a[1],a[2]);
      if(!(S.log[k]&&S.log[k].tahajjud)){
        items.push({id:dn*100+9,at:tw.s,urgent:false,title:t("n_tah_title"),body:t("n_tah_body",{t:fmtT(tw.e),xp:N(XP_TAH)})});
      }
    }
    if(S.friday==="jumuah"&&S.mosque&&isFri(a[0],a[1],a[2])){
      var hm=S.mosque.split(":"), hh=+hm[0], mm=+hm[1];
      items.push({id:dn*100+8,at:localMs(a[0],a[1],a[2],hh,mm)-30*60000,urgent:false,title:t("n_mosque_title"),body:t("n_mosque_body",{t:fmtHM(hh,mm)})});
    }
  }
  return items.filter(function(i){return i.at>now+2000;}).sort(function(x,y){return x.at-y.at;}).slice(0,400);
}
function scheduleNative(){
  if(!NAT)return;
  if(schedBusy){schedAgain=true;return;}
  schedBusy=true;
  window.SalahNative.scheduleAll(buildSchedule(Date.now())).then(function(){},function(){}).then(function(){
    schedBusy=false;
    if(schedAgain){schedAgain=false;scheduleNative();}
  });
}

/* ---------- app updates (direct-download APK only; never in store builds) ---------- */
function updateInfo(){
  if(!NAT||STORE_BUILD||!S.update||S.update.n<=APP_VERSION||S.dismissed>=S.update.n)return null;
  return S.update;
}
function checkUpdate(force){
  if(!NAT||STORE_BUILD)return;
  var now=Date.now();
  if(!force&&now-S.lastCheck<6*3600000)return;
  S.lastCheck=now;save();
  fetch("https://api.github.com/repos/"+REPO+"/releases/latest",{headers:{"Accept":"application/vnd.github+json"}})
    .then(function(r){if(!r.ok)throw new Error("http");return r.json();})
    .then(function(j){
      var n=parseInt(String(j.tag_name||"").replace(/\D/g,""),10)||0;
      var apk=(j.assets||[]).filter(function(a){return /\.apk$/i.test(a.name);})[0];
      if(n>APP_VERSION&&apk){S.update={n:n,url:apk.browser_download_url,notes:String(j.body||"").slice(0,600)};}
      else{S.update=null;}
      save();render();
    }).catch(function(){});

/* ---------- logging a prayer ---------- */
function logPrayer(day,id){
  var now=Date.now(), w;
  if(id==="tahajjud"){
    w=tahWindows(now).filter(function(x){return x.day===day;})[0];
    if(!w||now<w.s||now>=w.e||isDone(w))return;
  }else{
    w=windowsFor(now).filter(function(x){return x.day===day&&x.id===id;})[0];
    if(!w||now<w.s||isDone(w))return;
  }
  var before=stats(), bBefore=earned(before);
  var ok=id==="tahajjud"?true:now<w.e;
  S.log[day]=S.log[day]||{};
  var rec={t:now,ok:ok};
  if(w.jum)rec.j=true;
  S.log[day][id]=rec;
  var after=stats(), bAfter=earned(after);
  S.badges=bAfter;
  save();
  scheduleNative();
  var nm=pinfo(id,w.jum).name;
  if(id==="tahajjud"){toast(t("t_tah",{xp:N(XP_TAH)}),"green");chime(true);confetti();}
  else{
    toast(ok?t("t_xp_on",{xp:N(winXp(w)),p:nm}):t("t_xp_late",{xp:N(XP_LATE),p:nm}),ok?"green":"");
    chime(ok);
    if(ok||dayCount(day)===5)confetti();
    if(dayCount(day)===5){setTimeout(function(){toast(t("t_perfect",{xp:N(20)}),"gold");},700);}
  }
  if(after.level>before.level){setTimeout(function(){toast(t("t_level",{n:N(after.level)}),"gold");confetti();},1300);}
  bAfter.forEach(function(b){
    if(bBefore.indexOf(b)<0){
      var bd=BADGES.filter(function(x){return x.id===b;})[0];
      setTimeout(function(){toast(t("t_badge",{e:bd.em,name:badgeName(bd)}),"gold");},1900);
    }
  });
  render();
}

    .then(function(j){

  for(i=0;i<ws.length;i++){if(ws[i].s>now){nw=ws[i];break;}}
  return {cw:cw,nw:nw};
}

    h+='<div class="cd" id="cd">--:--:--</div>';
    h+='<div class="bar"><i id="bar" style="width:0%"></i></div>';
    h+='<div class="meta"><span>'+esc(t("started",{t:fmtT(cw.s)}))+'</span><span>'+esc(t("ends",{t:fmtT(cw.e)}))+'</span></div>';
    if(done){
      var r=S.log[cw.day][cw.id];
      h+='<div class="done-pill">'+esc(r.ok?t("done_on",{xp:N(r.j?XP_JUM:XP_ON)}):t("done_late",{xp:N(XP_LATE)}))+'</div>';
    }else{
      h+=btn("pray",esc(t("i_prayed")),"",' data-day="'+cw.day+'" data-id="'+cw.id+'"');
    }
    if(nw){
      var ni=pinfo(nw.id,nw.jum);
      h+='<div class="next">'+esc(t("next_line",{p:ni.icon+" "+ni.name,t:fmtT(nw.s),cd:"\u0001"})).replace("\u0001",'<span id="nx" dir="ltr">--:--:--</span>')+'</div>';
    }
  }else if(nw){
    var ni2=pinfo(nw.id,nw.jum);
    h+='<div class="label">'+esc(t("next_prayer"))+'</div><div class="pname">'+ni2.icon+' '+esc(ni2.name)+secName(ni2)+'</div>';
    h+='<div class="cd" id="cd">--:--:--</div>';
    h+='<div class="meta"><span>'+esc(t("starts_at",{t:fmtT(nw.s)}))+'</span><span>'+esc(t("no_fard"))+'</span></div>';
  }
  h+='</section>';

  // today list
  h+='<section class="card"><h2>'+esc(t("today"))+'</h2><ul>';
  ws.filter(function(w){return w.day===todayKey;}).forEach(function(w){
    var pi=pinfo(w.id,w.jum), r=S.log[w.day]&&S.log[w.day][w.id];
    var isCur=cw&&cw.day===w.day&&cw.id===w.id;
    var act;
    if(r){act=r.ok?'<span class="tag ok">'+esc(t("ok_tag",{xp:N(r.j?XP_JUM:XP_ON)}))+'</span>':'<span class="tag late">'+esc(t("late_tag",{xp:N(XP_LATE)}))+'</span>';}
    else if(isCur){act=btn("pray",esc(t("pray")),"sm",' data-day="'+w.day+'" data-id="'+w.id+'"');}
    else if(now>=w.e){act=btn("pray",esc(t("qada")),"sm gold",' data-day="'+w.day+'" data-id="'+w.id+'"');}
    else{act='<span class="tag lock">🔒</span>';}
    h+='<li class="row'+(isCur?" cur":"")+'"><span class="ic">'+pi.icon+'</span><div class="nm"><b>'+esc(pi.name)+'</b>'+secName(pi)+'<div class="tm">'+fmtT(w.s)+' – '+fmtT(w.e)+'</div></div>'+act+'</li>';
  });
  var tws=tahWindows(now);
  var tw=tws.filter(function(x){return now>=x.s&&now<x.e;})[0]||tws.filter(function(x){return x.s>now;})[0];
  if(tw){
    var tpi=pinfo("tahajjud"), tr=S.log[tw.day]&&S.log[tw.day].tahajjud, tcur=now>=tw.s&&now<tw.e, tact;
    if(tr){tact='<span class="tag ok">'+esc(t("ok_tag",{xp:N(XP_TAH)}))+'</span>';}
    else if(tcur){tact=btn("pray",esc(t("pray")),"sm",' data-day="'+tw.day+'" data-id="tahajjud"');}
    else{tact='<span class="tag lock">🔒</span>';}
    h+='<li class="row opt'+(tcur&&!tr?" cur":"")+'"><span class="ic">'+tpi.icon+'</span><div class="nm"><b>'+esc(tpi.name)+'</b><small>'+esc(t("optional"))+' · +'+N(XP_TAH)+' XP</small><div class="tm">'+esc(t("tah_sub"))+' · '+fmtT(tw.s)+' – '+fmtT(tw.e)+'</div></div>'+tact+'</li>';
  }
  h+='</ul></section>';

  // week
  h+='<section class="card"><h2>'+esc(t("week"))+'</h2><div class="week">';
  var names=t("days").split(",");
  for(var i=6;i>=0;i--){
    var a=shift(p.y,p.m,p.d,-i), k=key(a[0],a[1],a[2]), l=S.log[k]||{};
    var wd=new Date(Date.UTC(a[0],a[1]-1,a[2])).getUTCDay();
    h+='<div class="day'+(i===0?" today":"")+'"><b>'+esc(names[wd])+'</b><div class="dots'+(dayCount(k)===5?" perfect":"")+'">';
    PR.forEach(function(x){var rr=l[x.id];h+='<i class="'+(rr?(rr.ok?"ok":"late"):"")+'"></i>';});
    h+='<i class="'+(l.tahajjud?"tah":"tahoff")+'"></i></div></div>';
  }
  h+='</div><div class="note">'+esc(t("week_note",{n:N(st.best)}))+'</div></section>';

  // badges
  var got=earned(st);
  h+='<section class="card"><h2>'+esc(t("badges",{a:N(got.length),b:N(BADGES.length)}))+'</h2><div class="badges">';
  BADGES.forEach(function(b){
    var on=got.indexOf(b.id)>=0;
    h+='<div class="badge '+(on?"got":"locked")+'"><span class="em">'+b.em+'</span>'+esc(badgeName(b))+'</div>';
  });
  h+='</div></section>';

  // location
  h+='<section class="card" id="loccard"><h2>'+esc(t("loc_title"))+'</h2>';
  h+='<div class="set"><span>📍 '+esc(S.loc.name)+'</span>'+btn("gps",esc(t("use_gps")),"sm")+'</div>';
  h+='<div class="locrow"><input id="locq" class="locin" type="text" placeholder="'+esc(t("search_ph"))+'" value="'+esc(locQuery)+'" autocomplete="off">'+btn("locsearch",esc(t("search")),"sm")+'</div>';
  if(locMsg)h+='<div class="note">'+esc(locMsg)+'</div>';
  locResults.forEach(function(r,i){h+='<button class="res" data-act="locpick" data-i="'+i+'">'+esc(r.name)+'</button>';});
  h+='<div class="note">'+esc(t("loc_note"))+'</div></section>';

  // settings
  h+='<section class="card"><h2>'+esc(t("set_title"))+'</h2>';
  h+='<div class="set"><span>'+esc(t("language"))+'</span><select data-act="langsel">';
  LANGS.forEach(function(l){h+='<option value="'+l.code+'"'+(S.lang===l.code?" selected":"")+'>'+esc(l.name)+'</option>';});
  h+='</select></div>';
  h+='<div class="set"><span>'+esc(t("h24"))+'</span>'+btn("h24",onOff(S.h24),S.h24?"sm":"sm ghost")+'</div>';
  if(DIG[curLang()])h+='<div class="set"><span>'+esc(t("digits"))+'</span>'+btn("digits",onOff(S.digits==="local"),S.digits==="local"?"sm":"sm ghost")+'</div>';
  h+='<div class="set"><span>'+esc(t("fri_pray"))+'</span><select data-act="friday"><option value="jumuah"'+(S.friday==="jumuah"?" selected":"")+'>'+esc(t("fri_opt_j"))+'</option><option value="dhuhr"'+(S.friday==="dhuhr"?" selected":"")+'>'+esc(t("fri_opt_d"))+'</option></select></div>';
  if(S.friday==="jumuah"){
    h+='<div class="set"><span>'+esc(t("mosque"))+'</span></div>';
    h+='<div class="locrow"><input id="mosque" class="locin" type="time" value="'+esc(S.mosque)+'" dir="ltr">'+(S.mosque?btn("mosclear",esc(t("mosque_clear")),"sm ghost"):"")+'</div>';
    h+='<div class="note" style="margin-top:0">'+esc(t("mosque_hint"))+'</div>';
  }
  h+='<div class="note">'+esc(t("fri_note",{xp:N(XP_JUM)}))+'</div></section>';

  // reminders
  var chips='';
  WARN_OPTS.forEach(function(m){chips+='<button class="chipb'+(S.settings.warns.indexOf(m)>=0?" on":"")+'" data-act="warnchip" data-v="'+m+'">'+esc(t("min",{m:N(m)}))+'</button>';});
  h+='<section class="card"><h2>'+esc(t("rem_title"))+'</h2>';
  if(NAT){
    var on=nperm==="granted";
    h+='<div class="set"><span>'+esc(t("bg_rem"))+'</span>'+btn("notif",esc(on?t("on"):t("turn_on")),on?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>'+esc(t("exact"))+'</span>'+btn("exact",esc(nexact?t("on"):t("allow")),nexact?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>'+esc(t("sound_fx"))+'</span>'+btn("sound",onOff(S.settings.sound),S.settings.sound?"sm":"sm ghost")+'</div>';
    h+='<div class="set" style="display:block"><span>'+esc(t("warn_title"))+'</span><div class="chipsrow">'+chips+'</div></div>';
    h+='<div class="set"><span>'+esc(t("tah_rem"))+'</span>'+btn("tahnotif",onOff(S.settings.tahNotif),S.settings.tahNotif?"sm":"sm ghost")+'</div>';
    h+='<div class="set"><span>'+esc(t("test_norm"))+'</span>'+btn("test",esc(t("test_btn")),"sm ghost")+'</div>';
    h+='<div class="set"><span>'+esc(t("test_urg"))+'</span>'+btn("testu",esc(t("test_btn")),"sm ghost")+'</div>';
    h+='<div class="note">'+esc(t("rem_note"))+'</div>';
  }else{
    h+='<div class="note">'+esc(t("web_note"))+'</div>';
  }
  h+='</section>';

  h+='<footer>'+esc(t("footer",{name:S.loc.name,v:N(APP_VERSION)}))+'</footer>';

  document.getElementById("app").innerHTML=h;
  updateLive(now,ws);
}

function updateLive(now,ws){
  var c=current(now,ws), cw=c.cw, nw=c.nw, cd=document.getElementById("cd");
  var hero=document.getElementById("hero");
  var title="Salah Streak";
  if(cw){
    var left=cw.e-now, total=cw.e-cw.s, nm=pinfo(cw.id,cw.jum).name;
    if(cd)cd.textContent=fmtCD(left);
    var bar=document.getElementById("bar");
    if(bar)bar.style.width=Math.min(100,Math.max(0,(now-cw.s)/total*100))+"%";
    var urgent=!isDone(cw)&&urgentMs()>0&&left<urgentMs();
    if(hero){if(urgent)hero.classList.add("urgent");else hero.classList.remove("urgent");}
    var bub=document.getElementById("bubble");
    if(bub&&urgent)bub.textContent=t("m_hurry",{m:N(Math.ceil(left/60000)),p:nm});
    var nx=document.getElementById("nx");
    if(nx&&nw)nx.textContent=fmtCD(nw.s-now);
    title=nm+" · "+fmtCD(left);
  }else if(nw){
    if(cd)cd.textContent=fmtCD(nw.s-now);
    title=pinfo(nw.id,nw.jum).name+" · "+fmtCD(nw.s-now);
  }
  document.title=title;
}

function tick(){
  var now=Date.now(), ws=windowsFor(now);
  var k=stateKey(now), p=dk(now);
  var ae=document.activeElement, typing=!!(ae&&(ae.id==="locq"||ae.id==="mosque"));
  if(!S.lang)return;
  if((k!==curKey||p.s===0)&&!typing){render();}else{updateLive(now,ws);}
}

/* ---------- language switching ---------- */
function setLang(code){
  if(!TR[code])return;
  var first=!S.lang;
  S.lang=code;
  S.digits=(code==="bn")?"local":"latn";
  if(S.h24===null||first)S.h24=(code==="fr"||code==="tr"||code==="id");
  save();applyLang();curKey="";
  render();scheduleNative();
}

/* ---------- events ---------- */
document.addEventListener("click",function(ev){
  var el=ev.target.closest?ev.target.closest("[data-act]"):null;
  if(!el||el.tagName==="SELECT")return;
  var act=el.getAttribute("data-act");
  if(act==="lang"){setLang(el.getAttribute("data-l"));}
  else if(act==="pray"){logPrayer(el.getAttribute("data-day"),el.getAttribute("data-id"));}
  else if(act==="upd-get"){var u=updateInfo();if(u&&NAT){window.SalahNative.openUrl(u.url);}}
  else if(act==="upd-later"){var u2=updateInfo();if(u2){S.dismissed=u2.n;save();render();}}
  else if(act==="gps"){useGps();}
  else if(act==="gotoloc"){var lc=document.getElementById("loccard");if(lc&&lc.scrollIntoView)lc.scrollIntoView({behavior:"smooth"});}
  else if(act==="keeploc"){S.locSet=true;save();render();}
  else if(act==="locsearch"){var q=document.getElementById("locq");if(q)locQuery=q.value;doSearch();}
  else if(act==="locpick"){var r=locResults[parseInt(el.getAttribute("data-i"),10)];if(r)setLocation(r);}
  else if(act==="warnchip"){
    var v=parseInt(el.getAttribute("data-v"),10), w=S.settings.warns, ix=w.indexOf(v);
    if(ix>=0)w.splice(ix,1);else w.push(v);
    w.sort(function(a,b){return b-a;});
    save();scheduleNative();render();
  }
  else if(act==="h24"){S.h24=!S.h24;save();scheduleNative();render();}
  else if(act==="digits"){S.digits=S.digits==="local"?"latn":"local";save();scheduleNative();render();}
  else if(act==="mosclear"){S.mosque="";save();scheduleNative();render();}
  else if(act==="tahnotif"){S.settings.tahNotif=!S.settings.tahNotif;save();scheduleNative();render();}
  else if(act==="sound"){S.settings.sound=!S.settings.sound;save();if(S.settings.sound)chime(false);render();}
  else if(act==="test"||act==="testu"){
    if(!NAT)return;
    if(nperm!=="granted"){toast(t("t_turn_first"));return;}
    var urgent=act==="testu";
    var title=urgent?t("n_testu_title",{p:t("p_asr")}):t("n_test_title");
    var body=urgent?t("n_testu_body",{m:N(5)}):t("n_test_body");
    window.SalahNative.testNow(urgent,title,body).then(function(ok){toast(ok?t(urgent?"t_testu_sent":"t_test_sent"):t("t_test_fail"));});
  }
  else if(act==="exact"){if(NAT){window.SalahNative.openExactSettings();}}
  else if(act==="notif"){
    if(!NAT)return;
    window.SalahNative.requestPermission().then(function(res){
      nperm=res;
      if(res==="granted"){toast(t("t_notif_on"),"green");scheduleNative();}
      else{toast(t("t_notif_blocked"));}
      refreshNative(render);
    });
  }
});
document.addEventListener("change",function(ev){
  var el=ev.target;
  if(!el||!el.getAttribute)return;
  var act=el.getAttribute("data-act");
  if(act==="langsel"){setLang(el.value);}
  else if(act==="friday"){S.friday=el.value==="dhuhr"?"dhuhr":"jumuah";save();curKey="";render();scheduleNative();}
  else if(el.id==="mosque"){S.mosque=/^\d\d:\d\d$/.test(el.value)?el.value:"";save();scheduleNative();render();}
});
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="locq")locQuery=ev.target.value;});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&ev.target&&ev.target.id==="locq"){locQuery=ev.target.value;doSearch();}
});

applyLang();
render();
refreshNative(function(){render();scheduleNative();});
checkUpdate(false);
setInterval(tick,1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();refreshNative(function(){render();scheduleNative();});}});
if(NAT){window.SalahNative.onResume(function(){refreshNative(function(){render();scheduleNative();});checkUpdate(false);});}
})();
</script>
</body>
</html>
